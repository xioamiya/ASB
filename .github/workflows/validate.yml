name: Validate repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python and shell syntax
        run: |
          python -m compileall -q scripts tools
          bash -n scripts/*.sh
      - name: Validate public artifact manifest
        run: python tools/validate_public_artifacts.py
